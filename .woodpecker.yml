when:
  - event: [push, manual]
    branch: main
  - event: pull_request

steps:
  - name: instrument-contracts
    image: node:22-bookworm-slim
    commands:
      - node --check observatory/lab007-ab/run.mjs
      - node --test observatory/lab007-ab/*.test.mjs
  - name: secrets
    image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
    commands:
      - apk add --no-cache curl tar git
      - test "$(git rev-parse --is-shallow-repository)" = false || git fetch --unshallow
      - curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
      - echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
      - tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - /tmp/gitleaks git --log-opts=--all --no-banner --redact
